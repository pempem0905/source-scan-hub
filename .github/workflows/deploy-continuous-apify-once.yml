name: Deploy Continuous Apify Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-continuous-apify-once.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production route
        run: sleep 45
      - name: Build and restart continuous native scan
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const names=['package.json','src/main.js','.actor/Dockerfile','.actor/actor.json','.actor/input_schema.json'];
            const files=names.map(name=>({name,format:'TEXT',content:fs.readFileSync('apify/native-orchestrator/'+name,'utf8')}));
            const res=await fetch('https://source-scan-hub.lovable.app/api/temp-deploy-apify-continuous',{
              method:'POST',headers:{'content-type':'application/json','x-one-shot':'continuous-20260816-v1'},body:JSON.stringify({orchestratorFiles:files})
            });
            const text=await res.text(); console.log(text);
            if(!res.ok) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
