name: Capture Native Worker Failure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-native-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failed worker log directly from Apify
        run: |
          curl -fsSL 'https://api.apify.com/v2/logs/eiUqUZVFQov1alClH' -o failed-worker.log
          tail -n 120 failed-worker.log
      - name: Upload worker log
        uses: actions/upload-artifact@v4
        with:
          name: failed-worker-log
          path: failed-worker.log
