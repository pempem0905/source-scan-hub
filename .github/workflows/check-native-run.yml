name: Diagnose Native Worker Failure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-native-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for diagnostic bridge deploy
        run: sleep 50
      - name: Abort failing orchestrator and capture worker log
        env:
          BOOTSTRAP_TOKEN: vKd5jIOoKvbcGSy7zWi0-LOVDXVNVjtU6RoHOq2z9oM
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const res = await fetch('https://source-scan-hub.lovable.app/api/bootstrap-native-apify', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-bootstrap-token': process.env.BOOTSTRAP_TOKEN },
              body: JSON.stringify({ action: 'diagnoseAbort', runId: 'kwD5Pa3RTFhzlvePl' }),
            });
            const text = await res.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { raw: text.slice(0, 20000) }; }
            fs.writeFileSync('native-failure.json', JSON.stringify({ httpStatus: res.status, ...payload }, null, 2));
            console.log(JSON.stringify({ httpStatus: res.status, ok: payload?.ok, failedRun: payload?.failedRun, aborted: payload?.aborted }, null, 2));
            if (!res.ok || payload?.ok === false) process.exit(1);
          })().catch((error) => {
            fs.writeFileSync('native-failure.json', JSON.stringify({ error: error instanceof Error ? error.message : String(error) }, null, 2));
            process.exit(1);
          });
          NODE
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure
          path: native-failure.json
