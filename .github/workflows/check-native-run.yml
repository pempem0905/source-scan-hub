name: Inspect Fresh Native Apify Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-native-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect new native runtime
        env:
          BOOTSTRAP_TOKEN: vKd5jIOoKvbcGSy7zWi0-LOVDXVNVjtU6RoHOq2z9oM
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            await new Promise(r => setTimeout(r, 10000));
            const res = await fetch('https://source-scan-hub.lovable.app/api/bootstrap-native-apify', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-bootstrap-token': process.env.BOOTSTRAP_TOKEN },
              body: JSON.stringify({ action: 'inspect', runId: 'iyNrEJxSVRQ2FGFmS' }),
            });
            const payload = await res.json();
            fs.writeFileSync('native-fresh-status.json', JSON.stringify({ httpStatus: res.status, ...payload }, null, 2));
            console.log(JSON.stringify({ httpStatus:res.status, ok:payload?.ok, limits:payload?.limits, targetRun:payload?.targetRun, workerRuns:payload?.workerRuns && {running:payload.workerRuns.running,ready:payload.workerRuns.ready,succeeded:payload.workerRuns.succeeded,failed:payload.workerRuns.failed}, runtime:payload?.runtime?.status }, null, 2));
            if (!res.ok || payload?.ok === false) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fresh-status
          path: native-fresh-status.json
