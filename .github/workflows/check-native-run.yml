name: Remove Duplicate Native Orchestrator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-native-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Abort duplicate manual orchestrator
        env:
          BOOTSTRAP_TOKEN: vKd5jIOoKvbcGSy7zWi0-LOVDXVNVjtU6RoHOq2z9oM
        run: |
          node <<'NODE'
          (async()=>{
            const res=await fetch('https://source-scan-hub.lovable.app/api/bootstrap-native-apify',{
              method:'POST',headers:{'content-type':'application/json','x-bootstrap-token':process.env.BOOTSTRAP_TOKEN},
              body:JSON.stringify({action:'diagnoseAbort',runId:'430ffx6XVecUbPG6l'})
            });
            const p=await res.json();
            console.log(JSON.stringify({httpStatus:res.status,ok:p?.ok,aborted:p?.aborted},null,2));
            if(!res.ok||p?.ok===false)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
