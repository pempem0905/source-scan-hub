name: Patch Native Continuous Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-native-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply native discovery patch
        run: python scripts/patch_continuous_discovery.py
      - name: Apply one-time Apify max-control patch
        run: python scripts/patch_apify_max_control.py
      - name: Validate native actors and bridge
        run: |
          node --check apify/native-worker/src/main.js
          node --check apify/native-orchestrator/src/main.js
      - name: Commit native discovery changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "source-scan-autopilot"
          git config user.email "75533279+pempem0905@users.noreply.github.com"
          git add apify/native-worker/src/main.js apify/native-orchestrator/src/main.js src/routes/api/bootstrap-native-apify.ts
          git commit -m "Run Apify native scan continuously at higher budget"
          git push
