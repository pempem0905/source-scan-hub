name: Patch Native Actor Permissions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-native-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make native actors full-permission before each restart
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/routes/api/bootstrap-native-apify.ts')
          s = p.read_text()
          old = '''async function scheduleAndRun(workerId: string, orchestratorId: string, forceLease: boolean) {\n  const [limits, schedules] = await Promise.all([apify("/users/me/limits"), apify("/schedules?limit=1000")]);'''
          new = '''async function scheduleAndRun(workerId: string, orchestratorId: string, forceLease: boolean) {\n  await Promise.all([\n    apify(`/actors/${encodeURIComponent(workerId)}`, { method: "PUT", body: JSON.stringify({ actorPermissionLevel: "FULL_PERMISSIONS" }) }),\n    apify(`/actors/${encodeURIComponent(orchestratorId)}`, { method: "PUT", body: JSON.stringify({ actorPermissionLevel: "FULL_PERMISSIONS" }) }),\n  ]);\n  const [limits, schedules] = await Promise.all([apify("/users/me/limits"), apify("/schedules?limit=1000")]);'''
          if old not in s:
              raise SystemExit('scheduleAndRun patch target not found')
          s = s.replace(old, new, 1)
          old2 = '''  const params = new URLSearchParams({ memory: "256", timeout: "4200", build: "latest", maxTotalChargeUsd: "0.1" });'''
          new2 = '''  const params = new URLSearchParams({ memory: "256", timeout: "4200", build: "latest", maxTotalChargeUsd: "0.1", forcePermissionLevel: "FULL_PERMISSIONS" });'''
          if old2 not in s:
              raise SystemExit('run params patch target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit full-permission restart bridge
        run: |
          git config user.name "source-scan-autopilot"
          git config user.email "75533279+pempem0905@users.noreply.github.com"
          git add src/routes/api/bootstrap-native-apify.ts
          git commit -m "Run native Actors with full Apify storage permissions"
          git push
