name: Patch Native Orchestrator Scaling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-native-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime-token-safe max capacity scaling
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apify/native-orchestrator/src/main.js')
          s = p.read_text()
          replacements = [
          (
          '''  const projectBudgetUsd = Math.max(1, Number(input.projectBudgetUsd ?? 50));\n  const requestedMode = String(input.mode ?? "auto").toLowerCase();''',
          '''  const projectBudgetUsd = Math.max(1, Number(input.projectBudgetUsd ?? 50));\n  const maxConcurrentJobs = Math.max(2, Math.min(256, Number(input.maxConcurrentJobs ?? 32)));\n  const forceLease = Boolean(input.forceLease ?? false);\n  const requestedMode = String(input.mode ?? "auto").toLowerCase();'''
          ),
          (
          '''  if (oldLease?.expiresAt && new Date(oldLease.expiresAt).getTime() > Date.now() && oldLease.runId !== runId) {''',
          '''  if (!forceLease && oldLease?.expiresAt && new Date(oldLease.expiresAt).getTime() > Date.now() && oldLease.runId !== runId) {'''
          ),
          (
          '''  async function limits() {\n    return apify("/users/me/limits");\n  }\n\n  async function publishStatus(extra = {}) {\n    const l = await limits().catch(() => null);''',
          '''  async function publishStatus(extra = {}) {'''
          ),
          (
          '''      maxConcurrentActorJobs: l?.limits?.maxConcurrentActorJobs ?? null,\n      activeActorJobs: l?.current?.activeActorJobCount ?? null,''',
          '''      maxConcurrentActorJobs: maxConcurrentJobs,\n      activeActorJobs: null,'''
          ),
          (
          '''    const l = await limits();\n    const maxJobs = Number(l?.limits?.maxConcurrentActorJobs ?? 1);\n    const active = Number(l?.current?.activeActorJobCount ?? 1);\n    const freeSlots = Math.max(0, maxJobs - active);\n    if (freeSlots <= 0) { await sleep(5000); continue; }\n\n    const dailyRemaining''',
          '''    const targetWorkerSlots = Math.max(1, maxConcurrentJobs - 1);\n\n    const dailyRemaining'''
          ),
          (
          '''    const slots = Math.max(0, Math.min(freeSlots, pending, budgetSlots));\n    if (slots <= 0) break;\n\n    batches += 1;\n    const ids = [];\n    for (let i = 0; i < slots && Date.now() < deadline; i += 1) ids.push(await startWorker(i + 1));\n    await publishStatus({ batch: batches, batchLaunched: ids.length, freeSlotsBefore: freeSlots, maxJobs });\n    if (!ids.length) break;''',
          '''    const slots = Math.max(0, Math.min(targetWorkerSlots, pending, budgetSlots));\n    if (slots <= 0) break;\n\n    batches += 1;\n    const ids = [];\n    for (let i = 0; i < slots && Date.now() < deadline; i += 1) {\n      try {\n        ids.push(await startWorker(i + 1));\n      } catch (error) {\n        const message = error instanceof Error ? error.message : String(error);\n        if (/limit|concurrent|too many|capacity|quota|429/i.test(message)) {\n          log.info("Account capacity reached; keeping every available slot full", { launched: ids.length, targetWorkerSlots, message: message.slice(0, 240) });\n          break;\n        }\n        throw error;\n      }\n    }\n    await publishStatus({ batch: batches, batchLaunched: ids.length, maxJobs: maxConcurrentJobs, targetWorkerSlots });\n    if (!ids.length) { await sleep(5000); continue; }'''
          ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Patch target not found:\n' + old[:180])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check apify/native-orchestrator/src/main.js
      - name: Commit patched orchestrator
        run: |
          git config user.name "source-scan-autopilot"
          git config user.email "75533279+pempem0905@users.noreply.github.com"
          git add apify/native-orchestrator/src/main.js
          git commit -m "Make native orchestrator fill all Apify slots"
          git push
