name: Patch Curated Vietnam Seeds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/patch_curated_seeds.py
      - .github/workflows/patch-curated-vn-seeds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch orchestrator seeds
        run: python scripts/patch_curated_seeds.py
      - name: Validate orchestrator
        run: node --check apify/native-orchestrator/src/main.js
      - name: Commit orchestrator seed catalog
        run: |
          git config user.name source-scan-autopilot
          git config user.email 75533279+pempem0905@users.noreply.github.com
          git add apify/native-orchestrator/src/main.js
          git commit -m "Seed major Vietnam malls and nationwide brands"
          git push
