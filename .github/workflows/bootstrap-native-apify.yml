name: Activate Apify Native Control Plane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-native-apify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for display deployment
        run: sleep 60
      - name: Activate native schedule and first run
        env:
          BOOTSTRAP_TOKEN: vKd5jIOoKvbcGSy7zWi0-LOVDXVNVjtU6RoHOq2z9oM
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            let record;
            try {
              const res = await fetch('https://source-scan-hub.lovable.app/api/bootstrap-native-apify', {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-bootstrap-token': process.env.BOOTSTRAP_TOKEN },
                body: '{}',
              });
              const text = await res.text();
              let payload;
              try { payload = JSON.parse(text); } catch { payload = { raw: text.slice(0, 10000) }; }
              record = { httpStatus: res.status, ...payload };
              if (!res.ok || payload.ok === false) fs.writeFileSync('.activate_failed', '1');
            } catch (error) {
              record = { transportError: error instanceof Error ? error.message : String(error) };
              fs.writeFileSync('.activate_failed', '1');
            }
            fs.writeFileSync('native-activation-result.json', JSON.stringify(record, null, 2));
            console.log(JSON.stringify(record, null, 2));
          })().catch((error) => {
            fs.writeFileSync('native-activation-result.json', JSON.stringify({ scriptError: error instanceof Error ? error.message : String(error) }, null, 2));
            fs.writeFileSync('.activate_failed', '1');
          });
          NODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-activation-result
          path: native-activation-result.json
      - name: Fail if activation failed
        if: always()
        run: test ! -f .activate_failed
