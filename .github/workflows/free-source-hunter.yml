name: Free Source Hunter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-source-hunter.yml'
      - 'free-source-hunter/hunter.py'
      - 'free-source-hunter/bootstrap_free.py'
      - 'free-source-hunter/cc_domain_discovery.py'
      - 'free-source-hunter/free_search_discovery.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: free-source-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FREE_HUNTER_MAX_SECONDS: '600'
      FREE_HUNTER_MAX_FETCHES: '320'
      FREE_HUNTER_HTTP_WORKERS: '6'
      FREE_HUNTER_CC_PATTERNS: '2'
      FREE_HUNTER_CC_LIMIT: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pin current Common Crawl index and disable blocked legacy import
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('free-source-hunter/state.json')
          try: s=json.loads(p.read_text())
          except Exception: s={"version":1,"run_count":0,"cc_pattern_cursor":0,"frontier":[],"history":[]}
          s['cc_index']='CC-MAIN-2026-25'
          if str(s.get('legacy_import_status','')).startswith('read_failed:'):
              s['legacy_import_complete']=True
              s['legacy_import_status']='baseline_kept_external_no_runtime_dependency'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Bootstrap free frontier
        run: python3 free-source-hunter/bootstrap_free.py
      - name: Common Crawl discovery
        run: python3 free-source-hunter/cc_domain_discovery.py
      - name: Free web-search discovery fallback
        run: python3 free-source-hunter/free_search_discovery.py
      - name: Validate and expand free frontier
        run: python3 free-source-hunter/hunter.py
      - name: Build static monitor snapshot
        run: |
          mkdir -p docs/data
          python3 <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          root=Path('free-source-hunter')
          def read_json(p, default):
              try: return json.loads(p.read_text())
              except Exception: return default
          status=read_json(root/'status.json', {})
          state=read_json(root/'state.json', {})
          recent=[]
          ep=root/'evidence.jsonl'
          if ep.exists():
              lines=ep.read_text(errors='replace').splitlines()[-120:]
              for line in lines:
                  try: recent.append(json.loads(line))
                  except Exception: pass
          snapshot={
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
              'legacy_baseline_domains': 6117,
              'status': status,
              'discovery': {
                  'free_search_last_added': state.get('free_search_last_added',0),
                  'free_search_last_errors': state.get('free_search_last_errors',0),
                  'free_search_last_queries': state.get('free_search_last_queries',[]),
                  'cc_domain_last_added': state.get('cc_domain_last_added',0),
                  'cc_domain_pattern': state.get('cc_domain_pattern'),
                  'cc_domain_page': state.get('cc_domain_page'),
              },
              'recent_sources': recent,
          }
          Path('docs/data/engine.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          src=root/'master_domains.txt'
          Path('docs/data/master_domains.txt').write_text(src.read_text(errors='replace') if src.exists() else '')
          PY
      - name: Persist frontier, master domains and monitor snapshot
        run: |
          git config user.name "source-scan-free-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-source-hunter/state.json free-source-hunter/status.json free-source-hunter/master_domains.txt free-source-hunter/seen_urls.txt free-source-hunter/evidence.jsonl docs/data/engine.json docs/data/master_domains.txt
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Free source hunter checkpoint [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-monitor:
    needs: scan
    if: always() && needs.scan.result == 'success'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest dashboard snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload monitor artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy monitor
        id: deployment
        uses: actions/deploy-pages@v5
