name: Free Source Hunter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-source-hunter.yml'
      - 'free-source-hunter/hunter.py'
      - 'free-source-hunter/bootstrap_free.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-source-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FREE_HUNTER_MAX_SECONDS: '600'
      FREE_HUNTER_MAX_FETCHES: '320'
      FREE_HUNTER_HTTP_WORKERS: '6'
      FREE_HUNTER_CC_PATTERNS: '2'
      FREE_HUNTER_CC_LIMIT: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pin current Common Crawl index and disable blocked legacy import
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('free-source-hunter/state.json')
          try: s=json.loads(p.read_text())
          except Exception: s={"version":1,"run_count":0,"cc_pattern_cursor":0,"frontier":[],"history":[]}
          s['cc_index']='CC-MAIN-2026-25'
          if str(s.get('legacy_import_status','')).startswith('read_failed:'):
              s['legacy_import_complete']=True
              s['legacy_import_status']='baseline_kept_external_no_runtime_dependency'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Bootstrap free frontier
        run: python3 free-source-hunter/bootstrap_free.py
      - name: Run free Common Crawl source hunter
        run: python3 free-source-hunter/hunter.py
      - name: Persist frontier and master domains
        run: |
          git config user.name "source-scan-free-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-source-hunter/state.json free-source-hunter/status.json free-source-hunter/master_domains.txt free-source-hunter/seen_urls.txt free-source-hunter/evidence.jsonl
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Free source hunter checkpoint [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
