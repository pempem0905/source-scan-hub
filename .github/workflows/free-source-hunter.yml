name: Free Source Hunter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-source-hunter.yml'
      - 'free-source-hunter/hunter.py'
      - 'free-source-hunter/bootstrap_free.py'
      - 'free-source-hunter/cc_domain_discovery.py'
      - 'free-source-hunter/free_search_discovery.py'
      - 'free-source-hunter/frontier_scheduler.py'
      - 'free-source-hunter/reconcile_frontier_status.py'
      - 'integration/build_master_input.py'
      - 'integration/quality_gate_sources.py'
      - 'integration/build_hard_access_queue.py'
      - 'integration/legacy-source-seed.jsonl'
      - 'integration/promo-source-export.jsonl'
      - 'config/promo-workers.json'
      - 'l2/auth-status.json'
  # ⛔ FROZEN (EMERGENCY FREEZE, user request): schedule disabled, file preserved.
  # To restore: uncomment the 2 lines below.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-source-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      FREE_HUNTER_MAX_SECONDS: '660'
      FREE_HUNTER_MAX_FETCHES: '2500'
      FREE_HUNTER_HTTP_WORKERS: '8'
      FREE_HUNTER_CC_PATTERNS: '4'
      FREE_HUNTER_CC_LIMIT: '500'
      FREE_HUNTER_PER_HOST_BATCH: '16'
      FREE_HUNTER_ACTIVE_FRONTIER: '1800'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pin current Common Crawl index and disable blocked legacy import
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('free-source-hunter/state.json')
          try: s=json.loads(p.read_text())
          except Exception: s={"version":1,"run_count":0,"cc_pattern_cursor":0,"frontier":[],"history":[]}
          s['cc_index']='CC-MAIN-2026-25'
          if str(s.get('legacy_import_status','')).startswith('read_failed:'):
              s['legacy_import_complete']=True
              s['legacy_import_status']='baseline_kept_external_no_runtime_dependency'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Bootstrap free frontier
        run: python3 free-source-hunter/bootstrap_free.py
      - name: Common Crawl discovery
        run: python3 free-source-hunter/cc_domain_discovery.py
      - name: Free web-search discovery fallback
        run: python3 free-source-hunter/free_search_discovery.py
      - name: Diversify active frontier across hosts
        run: python3 free-source-hunter/frontier_scheduler.py
      - name: Validate and expand free frontier
        run: python3 free-source-hunter/hunter.py
      - name: Reconcile active and deferred frontier status
        run: python3 free-source-hunter/reconcile_frontier_status.py
      - name: Build canonical master input, quality gate and hard-access queue
        run: |
          python3 integration/build_master_input.py
          python3 integration/quality_gate_sources.py
          python3 integration/build_hard_access_queue.py
      - name: Build static monitor snapshot
        run: |
          mkdir -p docs/data
          python3 <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          root=Path('free-source-hunter')
          def read_json(p, default):
              try: return json.loads(p.read_text())
              except Exception: return default
          status=read_json(root/'status.json', {})
          state=read_json(root/'state.json', {})
          master_input=read_json(Path('integration/master_input_status.json'), {})
          l2_shadow=read_json(Path('l2/shadow-status.json'), {})
          l2_hard=read_json(Path('l2/hard-access-status.json'), {})
          l2_auth=read_json(Path('l2/auth-status.json'), {})
          worker_config=read_json(Path('config/promo-workers.json'), {})
          recent=[]
          ep=root/'evidence.jsonl'
          if ep.exists():
              lines=ep.read_text(errors='replace').splitlines()[-120:]
              for line in lines:
                  try: recent.append(json.loads(line))
                  except Exception: pass
          snapshot={
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
              'legacy_baseline_domains': 6117,
              'status': status,
              'master_input': master_input,
              'promo_workers': worker_config,
              'l2_shadow': l2_shadow,
              'l2_hard_access': l2_hard,
              'l2_auth': l2_auth,
              'discovery': {
                  'free_search_last_added': state.get('free_search_last_added',0),
                  'free_search_last_errors': state.get('free_search_last_errors',0),
                  'free_search_last_queries': state.get('free_search_last_queries',[]),
                  'cc_domain_last_added': state.get('cc_domain_last_added',0),
                  'cc_domain_pattern': state.get('cc_domain_pattern'),
                  'cc_domain_page': state.get('cc_domain_page'),
                  'frontier_scheduler': state.get('frontier_scheduler',{}),
              },
              'recent_sources': recent,
          }
          Path('docs/data/engine.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          src=root/'master_domains.txt'
          Path('docs/data/master_domains.txt').write_text(src.read_text(errors='replace') if src.exists() else '')
          PY
      - name: Persist frontier, master input and monitor snapshot
        run: |
          git config user.name "source-scan-free-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-source-hunter/state.json free-source-hunter/status.json free-source-hunter/master_domains.txt free-source-hunter/seen_urls.txt free-source-hunter/evidence.jsonl docs/data/engine.json docs/data/master_domains.txt integration/master_input_sources_v1.jsonl integration/master_input_status.json integration/promo_dispatch_plan_v1.jsonl l2/hard-access-queue.jsonl l2/hard-access-status.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Free source hunter checkpoint [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
