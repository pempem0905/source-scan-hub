name: PROMO L2 Handoff Retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: promo-l2-handoff-retry
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bridge helpers
        run: python -m py_compile l2/retry_handoff_request.py l2/reconcile_bridge_status.py l2/bridge_selftest.py l2/browser_run_cdp.py
      - name: Verify bridge invariants before retry
        run: python l2/bridge_selftest.py
      - name: Re-arm retry if cooldown elapsed
        run: python l2/retry_handoff_request.py
      - name: Persist sanitized request transition
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try: d=json.loads(Path('l2/handoff-request.json').read_text())
          except Exception: d={}
          print(str(d.get('state') or ''))
          PY
          )
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          git config user.name "promo-l2-retry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l2/handoff-request.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "PROMO L2 re-arm secure handoff request"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch armed Browser Run request explicitly
        # Commits made by this workflow use GITHUB_TOKEN. GitHub intentionally does
        # not recursively trigger another push workflow from those commits, so an
        # explicit workflow_dispatch is required whether or not the request file
        # changed during this run.
        if: steps.persist.outputs.state == 'REQUESTED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t FIELDS < <(python3 - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('l2/handoff-request.json').read_text())
          reg=json.loads(Path('l2/preauth-platforms.json').read_text())
          platform=str(req.get('platform') or '')
          state=str(req.get('state') or '')
          entry=(reg.get('platforms') or {}).get(platform) or {}
          start_url=str(entry.get('start_url') or '')
          if state != 'REQUESTED': raise SystemExit('request not armed')
          if not platform or not start_url.startswith(('https://','http://')): raise SystemExit('invalid request')
          print(platform)
          print(start_url)
          PY
          )
          PLATFORM="${FIELDS[0]}"
          START_URL="${FIELDS[1]}"
          gh workflow run promo-l2-browser-run-bridge.yml --ref main \
            -f mode=handoff \
            -f platform="$PLATFORM" \
            -f start_url="$START_URL"
          echo 'Browser Run bridge dispatch accepted; sensitive runtime material remains runtime-only.'
