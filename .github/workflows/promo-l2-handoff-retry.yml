name: PROMO L2 Handoff Retry

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo-l2-handoff-retry
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retry helper
        run: python -m py_compile l2/retry_handoff_request.py
      - name: Re-arm retry if cooldown elapsed
        run: python l2/retry_handoff_request.py
      - name: Persist sanitized request transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "promo-l2-retry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l2/handoff-request.json
          if git diff --cached --quiet; then exit 0; fi
          # Deliberately no [skip ci]: REQUESTED must trigger the request-driven bridge workflow.
          git commit -m "PROMO L2 re-arm secure handoff request"
          git pull --rebase origin main
          git push origin HEAD:main
