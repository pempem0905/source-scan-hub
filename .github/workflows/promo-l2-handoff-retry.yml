name: PROMO L2 Handoff Retry

on:
  # ⛔ FROZEN (EMERGENCY FREEZE, user request): both schedules disabled, file
  # preserved. This workflow is also the one that programmatically dispatches
  # promo-l2-browser-run-bridge.yml (via `gh workflow run`) once a retry is
  # armed — freezing this scheduler also stops that chained dispatch.
  # To restore: uncomment the 4 lines below.
  # schedule:
  #   - cron: '17,47 * * * *'
  #   - cron: '6 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: promo-l2-handoff-retry
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bridge helpers
        run: python -m py_compile l2/retry_handoff_request.py l2/reconcile_bridge_status.py l2/bridge_selftest.py l2/browser_run_cdp.py l2/update_metrics.py
      - name: Verify bridge invariants before retry
        run: python l2/bridge_selftest.py
      - name: Mark stale runtime evidence safely
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          p=Path('l2/bridge-runtime-status.json')
          try:
              d=json.loads(p.read_text())
          except Exception:
              raise SystemExit(0)
          raw=d.get('checked_at')
          try:
              checked=dt.datetime.fromisoformat(str(raw).replace('Z','+00:00')).astimezone(dt.timezone.utc)
          except Exception:
              checked=None
          now=dt.datetime.now(dt.timezone.utc)
          stale=checked is None or (now-checked).total_seconds() > 7200
          if stale and d.get('state') not in {'TAKEOVER_READY','SESSION_REUSE_VERIFIED'}:
              d['observation_stale']=True
              d['stale_after_seconds']=7200
              d['last_observed_state']=d.get('state')
              d['state']='STALE_RUNTIME_EVIDENCE'
              d['ready']=False
              d['transient_failure']=False
              d['note']='Runtime observation is stale; historical capability verification is retained separately. No login surface is considered active from stale evidence, and no sensitive runtime material is persisted.'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Re-arm retry if cooldown elapsed
        run: python l2/retry_handoff_request.py
      - name: Reconcile sanitized bridge and auth status
        run: python l2/reconcile_bridge_status.py
      - name: Refresh hard-only outcome metrics
        run: python l2/update_metrics.py
      - name: Verify bridge invariants after reconciliation
        run: python l2/bridge_selftest.py
      - name: Persist sanitized self-heal transition
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try: d=json.loads(Path('l2/handoff-request.json').read_text())
          except Exception: d={}
          print(str(d.get('state') or ''))
          PY
          )
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          git config user.name "promo-l2-retry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l2/handoff-request.json l2/bridge-status.json l2/bridge-runtime-status.json l2/auth-status.json l2/preauth-platforms.json l2/metrics.json l2/hard-outcomes.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "PROMO L2 hourly secure bridge self-heal [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch armed Browser Run request explicitly
        # Commits made by this workflow use GITHUB_TOKEN. GitHub intentionally does
        # not recursively trigger another push workflow from those commits, so an
        # explicit workflow_dispatch is required whether or not the request file
        # changed during this run.
        if: steps.persist.outputs.state == 'REQUESTED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t FIELDS < <(python3 - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('l2/handoff-request.json').read_text())
          reg=json.loads(Path('l2/preauth-platforms.json').read_text())
          platform=str(req.get('platform') or '')
          state=str(req.get('state') or '')
          entry=(reg.get('platforms') or {}).get(platform) or {}
          start_url=str(entry.get('start_url') or '')
          if state != 'REQUESTED': raise SystemExit('request not armed')
          if not platform or not start_url.startswith(('https://','http://')): raise SystemExit('invalid request')
          print(platform)
          print(start_url)
          PY
          )
          PLATFORM="${FIELDS[0]}"
          START_URL="${FIELDS[1]}"
          gh workflow run promo-l2-browser-run-bridge.yml --ref main \
            -f mode=handoff \
            -f platform="$PLATFORM" \
            -f start_url="$START_URL"
          echo 'Browser Run bridge dispatch accepted; sensitive runtime material remains runtime-only.'
