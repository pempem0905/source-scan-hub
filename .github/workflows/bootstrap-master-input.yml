name: Bootstrap Master Input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-master-input.yml'
      - 'integration/build_master_input.py'
      - 'integration/quality_gate_sources.py'
      - 'integration/legacy-source-seed.jsonl'
      - 'integration/promo-source-export.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-master-input
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build canonical master input
        run: python3 integration/build_master_input.py
      - name: Apply source quality gate
        run: python3 integration/quality_gate_sources.py
      - name: Persist canonical input bridge
        run: |
          git config user.name "promo-input-bridge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/master_input_sources_v1.jsonl integration/master_input_status.json integration/promo_dispatch_plan_v1.jsonl
          if git diff --cached --quiet; then
            echo "No input changes"
            exit 0
          fi
          git commit -m "Bootstrap canonical PROMO master input"
          git pull --rebase origin main
          git push origin HEAD:main
