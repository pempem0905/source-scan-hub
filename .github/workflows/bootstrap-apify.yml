name: Bootstrap Apify Autopilot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-apify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give production a moment to settle
        run: sleep 8
      - name: Deploy orchestrator, schedule it, and start first cycle
        env:
          BOOTSTRAP_TOKEN: A-bJiCblqjurbY-6glgsQRV6FZq0a7BhDvRr52W04pM
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'apify/orchestrator/';
          const names = ['package.json', 'src/main.js', '.actor/Dockerfile', '.actor/actor.json', '.actor/input_schema.json'];
          const sourceFiles = names.map((name) => ({ name, format: 'TEXT', content: fs.readFileSync(base + name, 'utf8') }));
          let record;
          try {
            const res = await fetch('https://source-scan-hub.lovable.app/api/bootstrap-apify', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-bootstrap-token': process.env.BOOTSTRAP_TOKEN,
              },
              body: JSON.stringify({ actorName: 'source-scan-hub-orchestrator', sourceFiles }),
            });
            const text = await res.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { raw: text.slice(0, 3000) }; }
            record = { httpStatus: res.status, ...payload };
            if (!res.ok || payload.ok === false) fs.writeFileSync('.bootstrap_failed', '1');
          } catch (error) {
            record = { transportError: error instanceof Error ? error.message : String(error) };
            fs.writeFileSync('.bootstrap_failed', '1');
          }
          fs.writeFileSync('bootstrap-result.json', JSON.stringify(record, null, 2));
          console.log(JSON.stringify(record, null, 2));
          NODE
      - name: Upload bootstrap result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-result
          path: bootstrap-result.json
      - name: Fail if bootstrap failed
        run: test ! -f .bootstrap_failed
