name: AccessTrade Promo Feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accesstrade-feed.yml'
      - 'integration/accesstrade_ingest.py'
      - 'integration/accesstrade_catalog_ingest.py'
      - 'integration/accesstrade_campaign_probe.py'
  # ⛔ FROZEN (EMERGENCY FREEZE, user request): schedule disabled, file preserved.
  # To restore: uncomment the 2 lines below.
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accesstrade-promo-feed
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check AccessTrade credentials
        id: auth
        env:
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_API_TOKEN_2: ${{ secrets.ACCESSTRADE_API_TOKEN_2 }}
        run: |
          if [ -n "${ACCESSTRADE_API_TOKEN}${ACCESSTRADE_API_TOKEN_2}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AccessTrade feed is installed but credentials are not configured in GitHub Actions secrets."
          fi

      - name: Ingest vouchers coupons deals and TikTok Shop feed
        if: steps.auth.outputs.enabled == 'true'
        env:
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_API_TOKEN_2: ${{ secrets.ACCESSTRADE_API_TOKEN_2 }}
          ACCESSTRADE_COUPON_LIMIT: '100'
          ACCESSTRADE_COUPON_MAX_PAGES: '10'
          ACCESSTRADE_TIKTOK_ENABLED: '1'
          ACCESSTRADE_TIKTOK_LIMIT: '20'
        run: python3 integration/accesstrade_ingest.py

      - name: Ingest approved campaigns active promotions and discounted product datafeeds
        if: steps.auth.outputs.enabled == 'true'
        env:
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_API_TOKEN_2: ${{ secrets.ACCESSTRADE_API_TOKEN_2 }}
        run: python3 integration/accesstrade_catalog_ingest.py

      - name: Probe campaign registration and approval states
        if: steps.auth.outputs.enabled == 'true'
        env:
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_API_TOKEN_2: ${{ secrets.ACCESSTRADE_API_TOKEN_2 }}
        run: python3 integration/accesstrade_campaign_probe.py

      - name: Validate generated feeds
        if: steps.auth.outputs.enabled == 'true'
        run: |
          python3 -m py_compile integration/accesstrade_ingest.py integration/accesstrade_catalog_ingest.py integration/accesstrade_campaign_probe.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=(
            'accesstrade_handoff_v1.jsonl',
            'accesstrade_sources.jsonl',
            'accesstrade_tiktok_feed.jsonl',
            'accesstrade_campaigns.jsonl',
            'accesstrade_catalog_handoff_v1.jsonl',
            'accesstrade_datafeeds.jsonl',
            'accesstrade_registered_campaigns.jsonl',
          )
          for name in names:
              p=Path('integration')/name
              if not p.exists():
                  raise SystemExit(f'missing {name}')
              for line in p.read_text(errors='replace').splitlines():
                  json.loads(line)
          for name in ('accesstrade_status.json','accesstrade_catalog_status.json','accesstrade_campaign_registration_status.json'):
              json.loads((Path('integration')/name).read_text())
          print('AccessTrade feeds validation OK')
          PY

      - name: Persist AccessTrade feeds
        if: steps.auth.outputs.enabled == 'true'
        run: |
          git config user.name "promo-accesstrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/accesstrade_handoff_v1.jsonl integration/accesstrade_sources.jsonl integration/accesstrade_tiktok_feed.jsonl integration/accesstrade_status.json integration/accesstrade_campaigns.jsonl integration/accesstrade_catalog_handoff_v1.jsonl integration/accesstrade_datafeeds.jsonl integration/accesstrade_catalog_status.json integration/accesstrade_registered_campaigns.jsonl integration/accesstrade_campaign_registration_status.json
          if git diff --cached --quiet; then
            echo "No AccessTrade feed changes"
            exit 0
          fi
          git commit -m "Refresh AccessTrade full promo catalog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
