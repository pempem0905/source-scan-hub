name: Inspect Apify Budget 40
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-budget40.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 25
      - name: Inspect Apify native runtime
        run: |
          node <<'NODE'
          (async()=>{
            const res = await fetch('https://source-scan-hub.lovable.app/api/temp-apify-budget40', {
              method:'POST',
              headers:{'content-type':'application/json','x-one-shot':'budget40-20260815-2249'},
              body:JSON.stringify({action:'inspect'})
            });
            const text = await res.text();
            console.log(text);
            if(!res.ok) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
