name: Affiliate Network Feeds
# credential recheck trigger 2026-08-19T11:24+07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/affiliate-network-feeds.yml'
      - 'integration/affiliate_networks_ingest.py'
      - 'integration/masoffer_ingest_v2.py'
      - 'integration/ecomobi_tracking_v3.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo-affiliate-network-feeds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ECOMOBI_API_KEY: ${{ secrets.ECOMOBI_API_KEY }}
      ECOMOBI_API_SECRET: ${{ secrets.ECOMOBI_API_SECRET }}
      ECOMOBI_API_TOKEN: ${{ secrets.ECOMOBI_API_TOKEN }}
      ECOMOBI_TOKEN: ${{ secrets.ECOMOBI_TOKEN }}
      ECOMOBI_TOKEN_PRIVATE: ${{ secrets.ECOMOBI_TOKEN_PRIVATE }}
      MASOFFER_PUBLISHER_ID: ${{ secrets.MASOFFER_PUBLISHER_ID }}
      MASOFFER_PUBLISHER_KEY: ${{ secrets.MASOFFER_PUBLISHER_KEY }}
      MASOFFER_API_TOKEN: ${{ secrets.MASOFFER_API_TOKEN }}
      MASOFFER_PUBLISHER_TOKEN: ${{ secrets.MASOFFER_PUBLISHER_TOKEN }}
      ECOMOBI_API_URLS: ${{ vars.ECOMOBI_API_URLS }}
      MASOFFER_API_URLS: ${{ vars.MASOFFER_API_URLS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Ecomobi Ecotrackings API v3
        run: python3 integration/ecomobi_tracking_v3.py

      - name: Ingest Ecomobi offer discovery and legacy MasOffer probes
        run: python3 integration/affiliate_networks_ingest.py

      - name: Ingest MasOffer with full publisher credentials
        run: python3 integration/masoffer_ingest_v2.py

      - name: Validate generated feed
        run: |
          python3 -m py_compile integration/ecomobi_tracking_v3.py integration/affiliate_networks_ingest.py integration/masoffer_ingest_v2.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('ecomobi_handoff_v1.jsonl','masoffer_handoff_v1.jsonl'):
              p=Path('integration')/name
              if not p.exists():
                  raise SystemExit(f'missing {name}')
              for line in p.read_text(errors='replace').splitlines():
                  json.loads(line)
          status=json.loads(Path('integration/affiliate_networks_status.json').read_text())
          e3=json.loads(Path('integration/ecomobi_tracking_status.json').read_text())
          m2=json.loads(Path('integration/masoffer_v2_status.json').read_text())
          assert status.get('production_write') is False
          assert status.get('verification_required') is True
          assert e3.get('state') in {'OK','AUTH_NOT_RESOLVED','CREDENTIALS_INCOMPLETE'}
          assert m2.get('state') in {'OK','API_NOT_RESOLVED','CREDENTIALS_INCOMPLETE'}
          print('Affiliate feed validation OK', 'EcomobiTracking='+str(e3.get('state')), 'MasOffer='+str(m2.get('state')))
          PY

      - name: Persist affiliate network feeds
        run: |
          git config user.name "promo-affiliate-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/ecomobi_handoff_v1.jsonl integration/ecomobi_tracking_status.json integration/masoffer_handoff_v1.jsonl integration/affiliate_networks_status.json integration/masoffer_v2_status.json
          if git diff --cached --quiet; then
            echo "No affiliate feed changes"
            exit 0
          fi
          git commit -m "Refresh Ecomobi and MasOffer feeds [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
