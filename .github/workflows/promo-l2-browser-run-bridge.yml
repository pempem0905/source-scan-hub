name: PROMO L2 Browser Run Bridge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or handoff"
        required: true
        default: "probe"
        type: choice
        options: [probe, handoff]
      platform:
        description: "authorized platform key"
        required: false
        default: "probe"
        type: string
      start_url:
        description: "authorized login/start URL"
        required: false
        default: "https://example.com/"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/promo-l2-browser-run-bridge.yml'
      - 'l2/browser_run_bridge.mjs'
      - 'l2/session_manager.py'
      - 'l2/preauth-platforms.json'

permissions:
  contents: write

concurrency:
  group: promo-l2-browser-run-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
      L2_BROWSER_KEEP_ALIVE_MS: '600000'
      L2_HANDOFF_TIMEOUT_MS: '1800000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate non-secret inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode || 'probe' }}'
          PLATFORM='${{ github.event.inputs.platform || 'probe' }}'
          START_URL='${{ github.event.inputs.start_url || 'https://example.com/' }}'
          case "$MODE" in probe|handoff) ;; *) echo 'invalid mode'; exit 2;; esac
          if ! [[ "$PLATFORM" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then echo 'invalid platform'; exit 2; fi
          if ! [[ "$START_URL" =~ ^https?:// ]]; then echo 'invalid start URL'; exit 2; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "start_url=$START_URL" >> "$GITHUB_OUTPUT"

      - name: Verify secret presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID unavailable to runtime'; exit 10; }
          test -n "${CLOUDFLARE_BROWSER_RUN_API_TOKEN:-}" || { echo 'CLOUDFLARE_BROWSER_RUN_API_TOKEN unavailable to runtime'; exit 11; }
          echo 'Cloudflare runtime settings are present (values suppressed).'

      - name: Prepare isolated CDP runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/promo-l2-cdp
          mkdir -p /tmp/promo-l2-cdp
          cp l2/browser_run_bridge.mjs /tmp/promo-l2-cdp/bridge.mjs
          cd /tmp/promo-l2-cdp
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --ignore-scripts playwright-core@1.55.0 >/dev/null
          echo 'Isolated Browser Run CDP runtime prepared.'

      - name: Execute secure Browser Run bridge with transient backoff
        id: bridge
        continue-on-error: true
        env:
          BRIDGE_MODE: ${{ steps.inputs.outputs.mode }}
          BRIDGE_PLATFORM: ${{ steps.inputs.outputs.platform }}
          BRIDGE_START_URL: ${{ steps.inputs.outputs.start_url }}
        shell: bash
        run: |
          set +e
          RC=99
          for DELAY in 0 20 60; do
            if [ "$DELAY" -gt 0 ]; then sleep "$DELAY"; fi
            node /tmp/promo-l2-cdp/bridge.mjs "$BRIDGE_MODE" "$BRIDGE_PLATFORM" "$BRIDGE_START_URL"
            RC=$?
            [ "$RC" -eq 75 ] || break
            echo 'Transient Browser Run rate limit; backing off without invalidating prior verification.'
          done
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write monotonic non-secret bridge runtime status
        env:
          BRIDGE_MODE: ${{ steps.inputs.outputs.mode }}
          BRIDGE_PLATFORM: ${{ steps.inputs.outputs.platform }}
          BRIDGE_RC: ${{ steps.bridge.outputs.rc }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          mode=os.environ.get('BRIDGE_MODE','probe'); platform=os.environ.get('BRIDGE_PLATFORM','probe')
          rc=int(os.environ.get('BRIDGE_RC','99') or 99); now=dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          p=Path('l2/bridge-runtime-status.json')
          try: prev=json.loads(p.read_text())
          except Exception: prev={}
          previously_verified=bool(prev.get('browser_session_created')) or prev.get('state')=='BROWSER_RUN_PROBE_VERIFIED'
          if mode=='probe' and rc==0:
              state='BROWSER_RUN_PROBE_VERIFIED'; created=True; handoff=False; reuse=False; last_verified_at=now
          elif mode=='probe' and rc==75:
              state='TRANSIENT_RATE_LIMIT'; created=previously_verified; handoff=bool(prev.get('human_handoff_exercised')); reuse=bool(prev.get('authenticated_session_reuse_verified')); last_verified_at=prev.get('last_verified_at') or prev.get('checked_at') if previously_verified else None
          elif mode=='probe':
              state='BROWSER_RUN_PROBE_FAILED'; created=previously_verified; handoff=bool(prev.get('human_handoff_exercised')); reuse=bool(prev.get('authenticated_session_reuse_verified')); last_verified_at=prev.get('last_verified_at') or (prev.get('checked_at') if previously_verified else None)
          elif rc==0:
              state='SESSION_REUSE_VERIFIED'; created=True; handoff=True; reuse=True; last_verified_at=now
          elif rc==75:
              state='TRANSIENT_RATE_LIMIT'; created=previously_verified; handoff=bool(prev.get('human_handoff_exercised')); reuse=bool(prev.get('authenticated_session_reuse_verified')); last_verified_at=prev.get('last_verified_at')
          else:
              state='HANDOFF_REUSE_UNVERIFIED' if rc==3 else 'HANDOFF_FAILED'; created=previously_verified; handoff=bool(prev.get('human_handoff_exercised')) or rc==3; reuse=bool(prev.get('authenticated_session_reuse_verified')); last_verified_at=prev.get('last_verified_at')
          payload={'schema':'promo.l2.bridge_runtime_status.v2','provider':'CLOUDFLARE_BROWSER_RUN','checked_at':now,'last_verified_at':last_verified_at,'mode':mode,'platform':platform,'state':state,'browser_session_created':created,'human_handoff_exercised':handoff,'authenticated_session_reuse_verified':reuse,'ready':bool(reuse),'transient_failure':rc==75,'secret_values_observable':False,'sensitive_runtime_material_persisted':False,'note':'No session IDs, websocket endpoints, Live View URLs, cookies, credentials, OTPs or CAPTCHA data are persisted.'}
          p.write_text(json.dumps(payload,indent=2)+'\n')
          PY

      - name: Persist only sanitized runtime status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "promo-l2-bridge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l2/bridge-runtime-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PROMO L2 bridge runtime status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce verified result
        env:
          BRIDGE_RC: ${{ steps.bridge.outputs.rc }}
        shell: bash
        run: |
          if [ "${BRIDGE_RC:-99}" = '75' ]; then
            echo 'Transient Cloudflare rate limit; preserving prior verified state.'
            exit 0
          fi
          test "${BRIDGE_RC:-99}" = '0'
