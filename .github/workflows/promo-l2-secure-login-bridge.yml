name: PROMO L2 Secure Login Bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'probe verifies Browser Run creation; handoff opens a human login window in Cloudflare Dashboard Live Sessions'
        required: true
        default: probe
        type: choice
        options: [probe, handoff]
      platform:
        description: 'Authorized platform profile'
        required: true
        default: grabfood
        type: choice
        options: [grabfood, shopeefood, tiktok, tiktokshop, uniqlo, smember]

permissions:
  contents: read

concurrency:
  group: promo-l2-secure-login-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
      L2_BROWSER_KEEP_ALIVE_MS: '600000'
      L2_HANDOFF_TIMEOUT_MS: '1800000'
      L2_HANDOFF_HEARTBEAT_S: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated CDP client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/promo-l2-cdp
          mkdir -p /tmp/promo-l2-cdp
          cp l2/browser_run_cdp.py /tmp/promo-l2-cdp/bridge.py
          python -m pip install --disable-pip-version-check --no-cache-dir 'websockets>=13,<16' >/dev/null
          python -m py_compile /tmp/promo-l2-cdp/bridge.py

      - name: Validate runtime secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is not available to this workflow'; exit 2; }
          test -n "${CLOUDFLARE_BROWSER_RUN_API_TOKEN:-}" || { echo 'CLOUDFLARE_BROWSER_RUN_API_TOKEN is not available to this workflow'; exit 2; }
          echo 'Cloudflare Browser Run runtime settings are present (values suppressed).'

      - name: Resolve authorized platform target
        id: target
        shell: python
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          import json, os
          from pathlib import Path
          operation = os.environ.get('INPUT_OPERATION') or 'probe'
          platform = os.environ.get('INPUT_PLATFORM') or 'grabfood'
          if operation not in {'probe','handoff'}:
              raise SystemExit('Unsupported operation')
          start_url = 'https://example.com/'
          if operation == 'handoff':
              data = json.loads(Path('l2/preauth-platforms.json').read_text())
              entry = data.get('platforms', {}).get(platform)
              if not entry or not entry.get('start_url'):
                  raise SystemExit('Selected platform has no approved preauth start_url')
              start_url = entry['start_url']
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as f:
              f.write(f'operation={operation}\n')
              f.write(f'platform={platform}\n')
              f.write(f'start_url={start_url}\n')

      - name: Create and verify Browser Run bridge
        shell: bash
        env:
          OPERATION: ${{ steps.target.outputs.operation }}
          PLATFORM: ${{ steps.target.outputs.platform }}
          START_URL: ${{ steps.target.outputs.start_url }}
        run: |
          set -euo pipefail
          python /tmp/promo-l2-cdp/bridge.py "$OPERATION" "$PLATFORM" "$START_URL"

      - name: Security invariant check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E 'l2/.*(session|handoff|cookie|token|takeover|websocket)' >/dev/null; then
            echo 'Unexpected sensitive-looking runtime artifact detected.'
            exit 3
          fi
          echo 'No sensitive bridge artifact was written to the repository.'
