<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoucherFreeVn — UI/UX Preview</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#17172a;--muted:#72738a;--line:#e7e7ef;--pri:#6d28d9;--pri2:#ede9fe;--gold:#b45309;--green:#067647;--shadow:0 8px 28px rgba(34,20,74,.07)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,#eee9ff 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1260px;margin:auto;padding:12px}.hero{position:sticky;top:0;z-index:30;background:rgba(247,247,251,.94);backdrop-filter:blur(14px);padding:8px 0 10px}.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #d9d2ff;background:#f5f2ff;color:#5b21b6;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750}.title{margin:7px 0 0;font-size:25px;line-height:1;font-weight:900;letter-spacing:-.02em}.sub{margin:6px 0 10px;color:var(--muted);font-size:12px}.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.search{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 14px;font-size:15px;outline:none;box-shadow:0 4px 18px rgba(20,20,50,.04)}.search:focus{border-color:#b8a6ff;box-shadow:0 0 0 3px #ede9fe}.clear{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:0 15px;font-weight:800;cursor:pointer}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;color:#46465c;cursor:pointer}.chip.on{background:var(--pri2);border-color:#c4b5fd;color:#5b21b6;font-weight:800}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}.stat{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 10px;font-size:11px;color:var(--muted)}.stat b{font-size:13px;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:220px}.cardtop{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}.merchant{font-size:12px;color:var(--muted);font-weight:800}.badge{white-space:nowrap;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;background:#ecfdf3;color:var(--green)}.badge.review{background:#fffaeb;color:#b54708}.ctitle{font-size:15px;line-height:1.35;font-weight:850;margin:7px 0 5px}.meta{display:flex;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:11px}.benefit{color:var(--gold);font-weight:850}.terms{font-size:12px;color:#55566b;line-height:1.45;margin:9px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:7px;margin-top:auto}.act{flex:1;text-align:center;text-decoration:none;border-radius:11px;padding:9px;border:1px solid var(--line);font-size:12px;font-weight:800;cursor:pointer}.code{background:#f5f3ff;color:#5b21b6}.source{background:#fff;color:#38384b}.details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:11px;color:#66677a;display:none;white-space:pre-wrap}.details.open{display:block}.empty{grid-column:1/-1;padding:45px 10px;text-align:center;color:var(--muted)}.footer{text-align:center;color:#9293a4;font-size:11px;padding:23px 10px}.toast{position:fixed;z-index:99;left:50%;bottom:20px;transform:translateX(-50%);background:#17172a;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.loading{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.wrap{padding:9px}.grid{grid-template-columns:1fr}.hero{padding-top:4px}.title{font-size:22px}.searchrow{grid-template-columns:1fr}.clear{padding:11px}.card{min-height:0}.terms{-webkit-line-clamp:2}.actions{position:sticky;bottom:0}.stat{padding:6px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">✦ Bản review độc lập · GitHub-first</div>
    <h1 class="title">VoucherFreeVn</h1>
    <div class="sub">Săn mã đúng lúc, đúng chỗ — ưu tiên mã đã xác minh và luôn giữ link nguồn để đối chiếu.</div>
    <div class="searchrow"><input id="q" class="search" placeholder="Tìm mã, Shopee, Grab, ăn uống, du lịch…"><button id="clear" class="clear">Xóa lọc</button></div>
    <div id="chips" class="chips"></div>
    <div id="stats" class="stats"></div>
  </div>
  <div id="grid" class="grid"><div class="loading">Đang tải kho mã…</div></div>
  <div class="footer">Preview UI/UX · dữ liệu đọc trực tiếp từ kho PROMO GitHub hiện tại · không dùng Lovable</div>
</div>
<div id="toast" class="toast">Đã sao chép mã</div>
<script>
const DATA='https://raw.githubusercontent.com/pempem0905/source-scan-hub/main/docs/data/promo_codes.json';
const cats=['Tất cả','Đã xác minh','Có điều kiện rõ','Ăn uống','Mua sắm','Du lịch','Giải trí'];
let db=null,state={q:'',cat:'Tất cả'};const $=id=>document.getElementById(id);const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function catOk(r,c){const t=norm([r.merchant,r.title,r.benefit_value,r.usage_terms,r.eligibility,r.evidence].join(' '));if(c==='Tất cả')return true;if(c==='Đã xác minh')return r.quality_tier==='ACTIVE_VERIFIED';if(c==='Có điều kiện rõ')return !!(r.usage_terms||r.eligibility);if(c==='Ăn uống')return /an uong|am thuc|food|f&b|nha hang|cafe|tra sua/.test(t);if(c==='Mua sắm')return /mua sam|shopee|lazada|retail|sieu thi|fashion|my pham/.test(t);if(c==='Du lịch')return /du lich|travel|hotel|may bay|ve may bay|booking/.test(t);if(c==='Giải trí')return /giai tri|cinema|rap phim|phim|game/.test(t);return true}
function filtered(){if(!db)return[];const q=norm(state.q);return db.records.filter(r=>catOk(r,state.cat)&&(!q||norm([r.code,r.merchant,r.title,r.benefit_value,r.usage_terms,r.eligibility].join(' ')).includes(q))).sort((a,b)=>{const av=a.quality_tier==='ACTIVE_VERIFIED'?0:1,bv=b.quality_tier==='ACTIVE_VERIFIED'?0:1;return av-bv||String(a.merchant||'').localeCompare(String(b.merchant||''),'vi')})}
function card(r,i){const verified=r.quality_tier==='ACTIVE_VERIFIED';const terms=r.usage_terms||r.eligibility||r.evidence||'Nguồn hiện tại chưa có điều kiện chi tiết; hãy mở nguồn trước khi dùng.';const ben=r.benefit_value||r.title||r.benefit_type||'Ưu đãi';return `<article class="card"><div class="cardtop"><div class="merchant">${esc(r.merchant||'Nguồn chính thức')}</div><span class="badge ${verified?'':'review'}">${verified?'✓ Đã xác minh':'Cần rà soát'}</span></div><div class="ctitle">${esc(r.title||ben)}</div><div class="meta"><span class="benefit">${esc(ben)}</span>${r.min_spend_vnd?`<span>· Đơn tối thiểu ${Number(r.min_spend_vnd).toLocaleString('vi-VN')}đ</span>`:''}${r.end_date?`<span>· HSD ${esc(r.end_date)}</span>`:''}</div><div class="terms">${esc(terms)}</div><div class="actions"><button class="act code" data-code="${esc(r.code)}">Lấy mã · ${esc(r.code)}</button>${r.source_url?`<a class="act source" href="${esc(r.source_url)}" target="_blank" rel="noopener">Nguồn ↗</a>`:`<button class="act source" data-detail="d${i}">Điều kiện</button>`}</div><button class="act source" style="margin-top:7px;width:100%" data-detail="d${i}">Xem điều kiện áp dụng</button><div id="d${i}" class="details">${esc(terms)}</div></article>`}
function render(){const a=filtered();$('stats').innerHTML=`<span class="stat"><b>${a.length.toLocaleString('vi-VN')}</b> kết quả</span><span class="stat"><b>${a.filter(r=>r.quality_tier==='ACTIVE_VERIFIED').length.toLocaleString('vi-VN')}</b> đã xác minh</span><span class="stat"><b>${new Set(a.map(r=>r.merchant).filter(Boolean)).size}</b> thương hiệu</span>`;$('grid').innerHTML=a.length?a.slice(0,180).map(card).join(''):'<div class="empty">Không có kết quả phù hợp. Thử từ khóa hoặc bộ lọc khác.</div>';document.querySelectorAll('[data-code]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code)}catch{}const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1100)});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>$(b.dataset.detail)?.classList.toggle('open'))}
$('chips').innerHTML=cats.map((c,i)=>`<button class="chip ${i===0?'on':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.cat=b.dataset.cat;render()});let timer;$('q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value;render()},90)};$('clear').onclick=()=>{state={q:'',cat:'Tất cả'};$('q').value='';document.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('on',i===0));render()};
(async()=>{try{const r=await fetch(DATA+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);db=await r.json();render()}catch(e){$('grid').innerHTML=`<div class="empty">Không tải được dữ liệu: ${esc(e.message)}</div>`}})();
</script>
</body></html>
